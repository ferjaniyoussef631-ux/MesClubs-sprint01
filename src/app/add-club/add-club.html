<div class="container">
  <div>
    <h2>Ajouter un Club :</h2>
  </div>
  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Club</label>
      <input type="text" [(ngModel)]="newClub.idClub" name="idClub" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Club</label>
      <input type="text" [(ngModel)]="newClub.nomClub" name="nomClub" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Ville Club</label>
      <input type="text" [(ngModel)]="newClub.villeClub" name="villeClub" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Budget Club</label>
      <input type="number" [(ngModel)]="newClub.budgetClub" name="budgetClub" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date création</label>
      <input type="date" [(ngModel)]="newClub.dateCreation" name="dateCreation" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Ligue</label>
      <select class="form-control form-control-lg" id="idLigue" name="idLigue" [(ngModel)]="newIdLigue">
        @for (ligue of ligues; track ligue.idLigue) {
          <option [value]="ligue.idLigue"> {{ligue.nomLigue}} </option>
        }
      </select>
    </div>
    <div class="mt-2">
      <button type="button" (click)="addClub()" class="btn btn-success">Ajouter</button>
    </div>
  </form>
</div>
