<div class="container">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <label>Ligues </label>
    <select class="form-control form-control-lg" id="idLigue" name="idLigue"
            [(ngModel)]="idLigue" (change)="onChange()">
      @for (ligue of ligues; track ligue.idLigue) {
        <option value="{{ligue.idLigue}}"> {{ligue.nomLigue}} </option>
      }
    </select>
  </div>
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <tr>
          <th>Id</th><th>Nom</th><th>Ville</th><th>Budget</th><th>Date Création</th><th>Ligue</th>
        </tr>
        @for (club of clubs; track club.idClub) {
          <tbody>
            <tr>
              <td>{{club.idClub}}</td>
              <td>{{club.nomClub}}</td>
              <td>{{club.villeClub}}</td>
              <td>{{club.budgetClub}}</td>
              <td>{{club.dateCreation | date:'dd/MM/yyyy'}}</td>
              @if (club.ligue) {
                <td>{{club.ligue.nomLigue}}</td>
              } @else {
                <td>PAS DE LIGUE</td>
              }
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
