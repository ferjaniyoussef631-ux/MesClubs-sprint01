<div class="container">
  <form class="form-inline">
    <div class="form-group mx-sm-3 mb-2 mt-2">
      <label>Nom Club en tapant</label>
      <input class="form-control" #searchTerm (keyup)="onKeyUp(searchTerm.value)">
    </div>
  </form>
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <tr>
          <th>Id</th><th>Nom</th><th>Ville</th><th>Budget</th><th>Date Création</th><th>Ligue</th>
        </tr>
        @for (club of clubs; track club.idClub) {
          <tbody>
            <tr>
              <td>{{club.idClub}}</td>
              <td>{{club.nomClub}}</td>
              <td>{{club.villeClub}}</td>
              <td>{{club.budgetClub}}</td>
              <td>{{club.dateCreation | date:'dd/MM/yyyy'}}</td>
              @if (club.ligue) {
                <td>{{club.ligue.nomLigue}}</td>
              } @else {
                <td>PAS DE LIGUE</td>
              }
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
